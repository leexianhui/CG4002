; CG4002 FireBeetle demo firmware — PlatformIO project.
; See firmware_demo/README.md for build/flash/config instructions.

[env:firebeetle32]
platform = espressif32
board = firebeetle32
framework = arduino
monitor_speed = 115200
build_flags =
    ; Include the normative wire-protocol header directly from shared/protocol/ instead of copying
    ; it — this firmware and comms/src/cg_comms/protocol/ must never drift apart (shared/README.md).
    -I../shared/protocol
    -I include

; Dev-bench stand-in: a generic ESP32 DevKitC V4 (no FireBeetle on hand yet). Same sketch/libs as
; env:firebeetle32 — this firmware only uses a plain GPIO button, no FireBeetle-specific peripherals.
[env:esp32dev]
extends = env:firebeetle32
board = esp32dev

[env:firebeetle32_test]
extends = env:firebeetle32
test_framework = unity
build_flags =
    ${env:firebeetle32.build_flags}

; Host-native test env: verifies CRC16 framing + nonce derivation against
; shared/protocol/golden_vectors.json without needing an ESP32 attached. Does NOT exercise
; AES-128-GCM itself (mbedtls is an ESP32-Arduino-bundled lib, not wired up for native here) — GCM
; correctness is instead proven the first time this firmware handshakes with a real cg-relay
; (see firmware_demo/README.md "Verification").
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -I ../shared/protocol
    -I include
    -I lib/cg_protocol
