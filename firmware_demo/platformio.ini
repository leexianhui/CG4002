; CG4002 FireBeetle demo firmware — PlatformIO project.
; See firmware_demo/README.md for build/flash/config instructions.

[env:firebeetle32]
platform = espressif32
board = firebeetle32
framework = arduino
monitor_speed = 115200
build_flags =
    ; Include the normative wire-protocol header directly from shared/protocol/ instead of copying
    ; it — this firmware and comms/src/cg_comms/protocol/ must never drift apart (shared/README.md).
    -I../shared/protocol
    -I include
    ; Silence the BLE stack's per-frame ESP_LOGE. A dropped notify is now counted and reported once
    ; a second by send_sensor_frame()'s dropped=N/s; at 50Hz the library's own error line for the
    ; same event printed 50x/sec, which both buried every other serial line and blocked the loop
    ; long enough to make the stall worse. Must be NONE, not ERROR: the levels are cumulative and
    ; ascending (NONE=0 < ERROR=1), so anything >= ERROR still emits log_e.
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_NONE

; Dev-bench stand-in: a generic ESP32 DevKitC V4 (no FireBeetle on hand yet). Same sketch/libs as
; env:firebeetle32 — this firmware only uses a plain GPIO button, no FireBeetle-specific peripherals.
[env:esp32dev]
extends = env:firebeetle32
board = esp32dev

; Temporary Player 2 dev-bench board (also a plain ESP32 DevKitC V4, until a second FireBeetle is
; available). Identical build to env:esp32dev except player identity, overridden here via build
; flag rather than editing cg_config.h — see the #ifndef guards there. Replace with a real
; env:firebeetle32_p2 (board = firebeetle32, same two -D flags) once P2's FireBeetle arrives.
[env:esp32dev_p2]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D CG_DEMO_PLAYER_ID=2
    -D CG_DEMO_BLE_DEVICE_NAME=\"CG4002-Demo-P2\"

[env:firebeetle32_test]
extends = env:firebeetle32
test_framework = unity
build_flags =
    ${env:firebeetle32.build_flags}

; Host-native test env: verifies CRC16 framing + nonce derivation against
; shared/protocol/golden_vectors.json without needing an ESP32 attached. Does NOT exercise
; AES-128-GCM itself (mbedtls is an ESP32-Arduino-bundled lib, not wired up for native here) — GCM
; correctness is instead proven the first time this firmware handshakes with a real cg-relay
; (see firmware_demo/README.md "Verification").
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -DCG_NATIVE_TEST
    -I ../shared/protocol
    -I include
    -I lib/cg_protocol
