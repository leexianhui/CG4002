# Real supplied hardware; distinct from the button-triggered comms demo.
player_id: 1
transport:
  kind: ble
  # Set CG_RELAY_TRANSPORT__BLE_ADDRESS to the scanned CG4002-Hardware-P1 address.
  ble_notify_char_uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
  ble_write_char_uuid: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
windowing:
  trigger_mode: false
  # The hub sends one segment per action its own segmenter accepted (hardware/gateway event mode,
  # the default); each complete segment becomes exactly one classifier request. A hub built with
  # -DCG_GATEWAY_EVENT_MODE=0 streams SENSOR_FRAMEs instead, which the stride settings below window.
  segment_mode: true
  # How long the relay waits for all 20 chunks of one action after the first arrives. At 2000 the
  # relay abandoned segments the hub was still delivering: P1's slow BLE link took ~3.2 s per action
  # (2026-11-07), every chunk arriving. 12 s is ~4x that. The hub itself re-sends an unACKed chunk at
  # 0/150/450/1050/2250 ms and gives up on the action ~4.6 s after that chunk's first send.
  segment_timeout_ms: 12000
  frame_rate_hz: 50.0
  # 100 samples = 2.0 s at 50 Hz: the input length the supplied AI model was trained on
  # (ai/config.py WINDOW). Stride 10 = one classification every 200 ms.
  window_samples: 100
  stride_frames: 10
  max_stale_pct: 20.0
  max_span_deviation_pct: 15.0

# Classifier (ai/classifier_server.py, or cg-ultra96-sim for canned actions) and engine both on the
# Ultra96, reached through the relay laptop's SSH tunnel on 127.0.0.1:8888 / 127.0.0.1:8443 --
# the same targets as relay.p1.yaml/relay.p2.yaml in the comms demo.
ultra96:
  host: "127.0.0.1"
  port: 8888
  # The AI is reached through the SSH tunnel and jump host with a ~30 KB window per swing: replies
  # take ~30-250 ms (2026-11-09 rig log), so 300 timed out the slow tail, and every timeout closes
  # and reconnects the classifier link (dropping the next swing too). 1 s still catches a wedged AI.
  request_timeout_ms: 1000
  max_in_flight: 2
  min_confidence: 0.6

engine_link:
  host: "127.0.0.1"
  port: 8443
  use_tls: true
  ca_cert_path: certs/engine.crt
  # bearer_token is NOT set here: CG_RELAY_ENGINE_LINK__BEARER_TOKEN in .env.relay. Leave the key
  # out entirely -- an explicit value here would override the env var.

# Secrets and per-board values come from .env.relay or the shell: CG_RELAY_PSK_HEX,
# CG_RELAY_TRANSPORT__BLE_ADDRESS, CG_RELAY_ENGINE_LINK__BEARER_TOKEN.
