# Per-weapon move set: damage, range, cooldown. Game-design data — owned jointly by Comms and
# whoever tunes game feel (COMMS_IMPLEMENTATION_PLAN.md §10.4).
#
# The resolver (engine/resolver.py) looks moves up here; it never branches on a literal weapon or
# action name (§16.3 rule 1). Move names must be members of ActionClass in shared/enums/enums.yaml.
#
# This is the single most likely file to change once the AI dataset's final class set lands
# (§16.2) — the report's move set is a starting point, not a guarantee.
#
# 2026-11-06: the AI is ONE weapon-agnostic model (ai/models/ACTION_FINAL) trained on all three weapons
# for the same 7 classes: IDLE + the 6 attacks below. Each weapon is held slightly differently but the
# motion of each action is the same, so every weapon has exactly those 6 moves; weapons differ only in
# damage / range / cooldown. CHARGED_ATTACK, CHARGED_THRUST and SWING (design-report moves) are not
# AI classes, so no weapon has them; they stay in ActionClass for wire compatibility only.

weapons:
  SWORD:      # balanced
    moves:
      HORIZONTAL_SWING: { damage: 10, range_m: 1.5, cooldown_ms: 800 }
      VERTICAL_SWING:   { damage: 12, range_m: 1.4, cooldown_ms: 900 }
      DIAGONAL_SWING:   { damage: 11, range_m: 1.5, cooldown_ms: 850 }
      THRUST:           { damage:  8, range_m: 1.8, cooldown_ms: 600 }
      SPIN_ATTACK:      { damage: 18, range_m: 1.6, cooldown_ms: 2000 }
      UPPERCUT:         { damage: 13, range_m: 1.3, cooldown_ms: 1000 }
  SPEAR:      # reach, lighter hits
    moves:
      HORIZONTAL_SWING: { damage:  8, range_m: 2.0, cooldown_ms: 1000 }
      VERTICAL_SWING:   { damage:  9, range_m: 2.0, cooldown_ms: 1000 }
      DIAGONAL_SWING:   { damage:  9, range_m: 2.0, cooldown_ms: 1000 }
      THRUST:           { damage: 12, range_m: 2.5, cooldown_ms: 700 }
      SPIN_ATTACK:      { damage: 15, range_m: 2.2, cooldown_ms: 2000 }
      UPPERCUT:         { damage: 10, range_m: 2.0, cooldown_ms: 1000 }
  MACE:       # heavy, short, slow
    moves:
      HORIZONTAL_SWING: { damage: 15, range_m: 1.3, cooldown_ms: 1150 }
      VERTICAL_SWING:   { damage: 16, range_m: 1.3, cooldown_ms: 1200 }
      DIAGONAL_SWING:   { damage: 15, range_m: 1.3, cooldown_ms: 1150 }
      THRUST:           { damage: 10, range_m: 1.2, cooldown_ms: 900 }
      SPIN_ATTACK:      { damage: 22, range_m: 1.4, cooldown_ms: 2200 }
      UPPERCUT:         { damage: 17, range_m: 1.2, cooldown_ms: 1300 }
