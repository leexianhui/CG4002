[platformio]
default_envs = p1_hub, p2_hub, p1_torso, p2_torso, p1_left, p2_left

[hardware]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi + BLE + the existing hardware algorithms require the 3 MB app partition.
; This profile assumes a 4 MB ESP32. Confirm the physical board before uploading.
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/configure.py
lib_extra_dirs = ../../comms/firmware/lib
lib_ldf_mode = chain+
build_flags = -I../../shared/protocol -DCG_HARDWARE_GATEWAY -DCORE_DEBUG_LEVEL=0

[env:p1_hub]
extends = hardware
board = firebeetle32
build_flags = ${hardware.build_flags} -DCG_GATEWAY_PLAYER=1 -DCG_GATEWAY_ROLE=0
[env:p2_hub]
extends = hardware
board = firebeetle32
build_flags = ${hardware.build_flags} -DCG_GATEWAY_PLAYER=2 -DCG_GATEWAY_ROLE=0
; Fallback hubs if p1_hub/p2_hub reboot-loop with "Should enable WiFi modem sleep when both WiFi
; and Bluetooth are enabled": the hardware sketch disables Wi-Fi modem sleep, which ESP32 BLE
; coexistence does not allow. Same build otherwise; costs some Wi-Fi latency.
[env:p1_hub_wifisleep]
extends = env:p1_hub
build_flags = ${env:p1_hub.build_flags} -DWIFI_SLEEP_DISABLED=0
[env:p2_hub_wifisleep]
extends = env:p2_hub
build_flags = ${env:p2_hub.build_flags} -DWIFI_SLEEP_DISABLED=0
[env:p1_torso]
extends = hardware
build_flags = ${hardware.build_flags} -DCG_GATEWAY_PLAYER=1 -DCG_GATEWAY_ROLE=1
[env:p2_torso]
extends = hardware
build_flags = ${hardware.build_flags} -DCG_GATEWAY_PLAYER=2 -DCG_GATEWAY_ROLE=1
[env:p1_left]
extends = hardware
build_flags = ${hardware.build_flags} -DCG_GATEWAY_PLAYER=1 -DCG_GATEWAY_ROLE=2
[env:p2_left]
extends = hardware
build_flags = ${hardware.build_flags} -DCG_GATEWAY_PLAYER=2 -DCG_GATEWAY_ROLE=2

[env:native_test]
platform = native
test_framework = unity
build_flags = -I../../shared/protocol -Iinclude
